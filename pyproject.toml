[project]
name = "arr"
version = "0.1.0"
description = "CLI local pour réarranger des morceaux : partition, prises complètes, greffe de stems"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "triton-xpu",
    "huggingface-hub>=0.36",
    "typer>=0.12",
    "rich>=13",
    "soundfile>=0.12",
    "numpy>=1.26",
    "tomli-w>=1.2.0",
    "demucs>=4.1.0",
    "beat-this>=1.1.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
arr = "arr.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arr"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv]
# Le projet vise une seule machine : Linux x86_64 avec une carte Intel Arc.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchaudio = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
