[project]
name = "arr"
version = "0.1.0"
description = "CLI local d'arrangement audio (stems, génération, structure)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "triton-xpu",
    "ace-step",
    "typer>=0.12",
    "rich>=13",
    "soundfile>=0.12",
    "numpy>=1.26",
    "tomli-w>=1.2.0",
    "demucs>=4.1.0",
    "beat-this>=1.1.0",
]

[project.scripts]
arr = "arr.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arr"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv]
# ACE-Step épingle torch en CUDA ; on force les roues XPU d'Intel à la place.
override-dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "torchao<0.16.0",
    "torchcodec; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchaudio = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
ace-step = { git = "https://github.com/ace-step/ACE-Step-1.5.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
