name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ffmpeg : conversions, étirement, mesure de volume ; libportaudio2 : sounddevice
      - name: Paquets système
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Sans cela, l'index des pages de manuel est reconstruit après l'installation
          # et l'étape peut rester bloquée plusieurs minutes.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg libportaudio2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Les tests n'utilisent ni GPU ni modèles : les moteurs sont remplacés par des faux.
      - name: Tests
        run: uv run pytest -q
